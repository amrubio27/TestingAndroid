name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: 🧪 Unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverHtmlReportDebug :app:koverVerifyDebug

      - name: Cobertura → resumen del run
        if: always()
        run: |
          XML=app/build/reports/kover/reportDebug.xml
          if [ -f "$XML" ]; then
            echo "## 🧪 Cobertura de líneas (unit)" >> "$GITHUB_STEP_SUMMARY"
            awk -F'"' '/type="LINE"/{m=$4;c=$6} END{t=m+c; if(t>0) printf "- **%d%%** (%d/%d líneas) — gate mínimo: 20%%\n", c*100/t, c, t}' "$XML" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit test results
          files: app/build/test-results/testDebugUnitTest/**/*.xml

  build:
    name: 🏗️ Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  static-analysis:
    name: 🔍 Static analysis (ktlint desactivado)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ktlint desactivado
        run: echo "ktlint está desactivado temporalmente. Para reactivarlo, descomenta el step 'ktlint'."

      # - uses: actions/checkout@v4
      # - name: Set up JDK 17
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: 17
      # - name: Set up Gradle
      #   uses: gradle/actions/setup-gradle@v4
      # - name: ktlint
      #   run: ./gradlew :app:ktlintCheck

  instrumented-tests:
    name: 📱 Instrumented (API ${{ matrix.api-level }})
    # Si tu organización tiene habilitados los "Larger runners" (GitHub > Settings > Runners),
    # cambia 'ubuntu-latest' por 'ubuntu-latest-4-cores' (o 8 / 16) para reducir el
    # tiempo de boot del emulador. En repos donde no estén habilitados se puede dejar
    # 'ubuntu-latest' sin problema.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 30, 34 ]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Caché de las system-images del SDK (≈2-3 GB por API). Sin esto se descargan
      # en cada run y son varios minutos muertos. La clave incluye libs.versions.toml:
      # si cambias versiones del SDK en Gradle, el caché se invalida correctamente.
      # Se cachean varias rutas porque la ruta exacta depende de la imagen del runner.
      - name: Cache Android SDK system images
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            /usr/lib/android-sdk/system-images
          key: ${{ runner.os }}-sysimg-${{ matrix.api-level }}-${{ hashFiles('gradle/libs.versions.toml') }}
          # Solo restauramos del mismo nivel de API: una system-image de API X
          # no es válida para API Y (el 'fallback' amplio podría cargar una
          # incorrecta).
          restore-keys: |
            ${{ runner.os }}-sysimg-${{ matrix.api-level }}-

      # Caché del AVD completo. '**' es necesario porque el userdata.img vive
      # dentro de ~/.android/avd/<avd_name>.avd/, y '@actions/cache' no es
      # recursivo con un solo '*'. Sin esto, el emulador hace cold-boot cada run.
      # Solo restauramos del mismo nivel de API (un AVD hecho para API X no es
      # válido para API Y); sin este acotado, 'fallback' podría cargar uno incorrecto.
      - name: Cache AVD (incluye userdata.img)
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/**
            ~/.android/adb*
          # Sin libs.versions.toml en la clave: el AVD no depende del catálogo de deps,
          # incluirlo invalidaría el caché en cada bump de versión sin motivo.
          key: ${{ runner.os }}-avd-${{ matrix.api-level }}
          restore-keys: |
            ${{ runner.os }}-avd-${{ matrix.api-level }}-

      # Solo se ejecuta cuando NO hay hit en el caché de AVD. El action crea el
      # AVD en '~/.android/avd/' y al finalizar el job, el step 'Cache AVD'
      # guarda todo ese árbol (incluido el 'userdata.img' gracias al '**').
      # En el siguiente run, cache-hit evita este paso y el emulador arranca
      # desde un AVD ya tibio, ahorrando los 5-7 min de cold boot.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot listo para API ${{ matrix.api-level }}"

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Publish instrumented results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Instrumented results (API ${{ matrix.api-level }})
          files: app/build/outputs/androidTest-results/connected/**/*.xml
      - name: Upload instrumented report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          retention-days: 7

  summary:
    name: 🧾 CI summary
    runs-on: ubuntu-latest
    needs: [ static-analysis, unit-tests, build, instrumented-tests ]
    if: always()
    steps:
      - name: Tabla resumen del pipeline
        run: |
          {
            echo "## 🧾 Resumen del pipeline"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| 🔍 Static analysis (ktlint desactivado) | ${{ needs.static-analysis.result == 'success' && '✅ pass' || format('❌ {0}', needs.static-analysis.result) }} |"
            echo "| 🧪 Unit tests + coverage gate | ${{ needs.unit-tests.result == 'success' && '✅ pass' || format('❌ {0}', needs.unit-tests.result) }} |"
            echo "| 🏗️ Assemble debug | ${{ needs.build.result == 'success' && '✅ pass' || format('❌ {0}', needs.build.result) }} |"
            echo "| 📱 Instrumented (API 30/34) | ${{ needs.instrumented-tests.result == 'success' && '✅ pass' || format('❌ {0}', needs.instrumented-tests.result) }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Marcar rojo si algo falló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Algún job del pipeline falló — revisa la tabla del Summary." >&2
          exit 1